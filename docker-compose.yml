services:
  postgres:
    image: postgres:16-alpine
    container_name: baleen-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baleen}
      POSTGRES_USER: ${POSTGRES_USER:-baleen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baleen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/tests/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baleen} -d ${POSTGRES_DB:-baleen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:${NEO4J_VERSION:-5}-community
    container_name: baleen-neo4j
    # Bounded resources so a co-tenanted host (e.g. a k3d/gmem VM) cannot
    # starve the graph of CPU/memory (see #21). Bump the *_CPUS/*_MEM env vars
    # on a dedicated box.
    cpus: ${NEO4J_CPUS:-2.0}
    mem_limit: ${NEO4J_MEM:-1.5g}
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-baleen_dev_pass}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Isolated Neo4j for the integration suite (#24): tests never mutate the live
  # graph the scheduler writes to. Not started by default — bring it up with
  # `docker compose up -d neo4j-test`; the test harness auto-promotes to it
  # (bolt://localhost:7690) when it is reachable, else falls back to 7687.
  # (7688 is deliberately avoided: the co-located gmem project already binds it.)
  neo4j-test:
    image: neo4j:${NEO4J_VERSION:-5}-community
    container_name: baleen-neo4j-test
    cpus: ${NEO4J_TEST_CPUS:-1.0}
    mem_limit: ${NEO4J_TEST_MEM:-768m}
    environment:
      NEO4J_AUTH: ${NEO4J_TEST_USER:-${NEO4J_USER:-neo4j}}/${NEO4J_TEST_PASSWORD:-${NEO4J_PASSWORD:-baleen_dev_pass}}
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7690:7687"
    volumes:
      - neo4j_test_data:/data
      - neo4j_test_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: baleen-backend
    # Optional: every variable below already has a default, so a plain
    # `docker compose up` boots a working demo with zero setup.
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      # .env's DATABASE_URL points at localhost, which inside the container is
      # the backend itself; override it so the DSN targets the postgres service.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-baleen}:${POSTGRES_PASSWORD:-baleen}@postgres:5432/${POSTGRES_DB:-baleen}
      NEO4J_URI: bolt://neo4j:7687
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:8001/v1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: baleen-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_test_data:
  neo4j_test_logs:
