services:
  postgres:
    image: postgres:16-alpine
    container_name: baleen-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baleen}
      POSTGRES_USER: ${POSTGRES_USER:-baleen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baleen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/tests/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baleen} -d ${POSTGRES_DB:-baleen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:${NEO4J_VERSION:-5}-community
    container_name: baleen-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-baleen_dev_pass}
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: baleen-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:8001/v1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: baleen-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
